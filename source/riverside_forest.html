<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>강가의 오두막 — 몰입형 3D 자연 탐험</title>
<style>
  :root { --ink:#f3efe6; --dim:#c9c3b4; --accent:#e8c98a; --panel:rgba(18,24,20,.78); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0f0d; overflow:hidden; font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--ink); }
  canvas#c { position:fixed; inset:0; width:100vw; height:100vh; display:block; outline:none; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(10,18,14,.35), rgba(6,10,8,.82)); backdrop-filter: blur(3px); z-index:10; padding:16px; }
  .card { width:min(640px,100%); background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:28px 30px; box-shadow:0 20px 70px rgba(0,0,0,.55); }
  h1 { font-size:28px; font-weight:700; margin:0 0 6px; letter-spacing:-.02em; }
  .sub { color:var(--dim); margin:0 0 20px; font-size:14.5px; line-height:1.6; }
  #loadBarWrap { height:6px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; margin-top:10px; }
  #loadBar { height:100%; width:0; background:linear-gradient(90deg,#8fbf7a,#e8c98a); transition:width .25s; }
  #loadText { font-size:13.5px; color:var(--dim); }
  #startBox { display:none; }
  button.primary { width:100%; padding:14px 18px; font-size:17px; font-weight:700; border:0; border-radius:12px; background:linear-gradient(180deg,#f1d79b,#d9b468); color:#2a2112; cursor:pointer; margin-top:6px; }
  button.primary:hover { filter:brightness(1.06); }
  button.ghost { padding:8px 12px; font-size:13px; border-radius:9px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:var(--ink); cursor:pointer; }
  button.ghost:hover { background:rgba(255,255,255,.14); }
  .keys { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px 18px; margin:0 0 16px; font-size:13.5px; color:var(--dim); }
  .keys b { display:inline-block; min-width:26px; text-align:center; padding:1px 7px; margin-right:6px; border-radius:6px; background:rgba(255,255,255,.12); color:var(--ink); font-weight:600; font-size:12.5px; }
  #menu { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(6,10,8,.55); backdrop-filter: blur(6px); z-index:9; padding:16px; overflow:auto; }
  #menu .card { width:min(560px,100%); }
  .row { display:grid; grid-template-columns: 120px 1fr 54px; align-items:center; gap:10px; margin:10px 0; font-size:14px; }
  .row label { color:var(--dim); }
  .row .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-size:13px; }
  .row.chk { grid-template-columns: 1fr auto; }
  input[type=range] { width:100%; accent-color:#e8c98a; }
  select { width:100%; padding:7px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:#1a2320; color:var(--ink); font-size:14px; }
  .presets { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  #hud { position:fixed; inset:0; pointer-events:none; display:none; z-index:5; }
  #cross { position:absolute; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px; border-radius:50%; background:rgba(255,255,255,.75); box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  #stats { position:absolute; left:12px; top:10px; font-size:12px; color:rgba(255,255,255,.75); text-shadow:0 1px 3px rgba(0,0,0,.8); font-variant-numeric:tabular-nums; }
  #hint { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); font-size:12.5px; color:rgba(255,255,255,.7); text-shadow:0 1px 3px rgba(0,0,0,.85); white-space:nowrap; }
  #err { display:none; position:fixed; left:16px; right:16px; bottom:16px; z-index:99; background:#5a1c1c; color:#fff; padding:12px 14px; border-radius:10px; font-size:13px; white-space:pre-wrap; }
  @media (max-width:560px){ .keys{grid-template-columns:1fr} .row{grid-template-columns:90px 1fr 48px} h1{font-size:23px} }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="overlay">
  <div class="card">
    <h1>강가의 오두막</h1>
    <p class="sub">맑은 강이 흐르는 전원 풍경 속으로. 숲길과 들판, 야생화 언덕, 그리고 강 위의 작은 부두까지 — 자유롭게 걸어 다니며 풍경을 감상해 보세요.</p>
    <div id="loading">
      <div id="loadText">준비 중…</div>
      <div id="loadBarWrap"><div id="loadBar"></div></div>
    </div>
    <div id="startBox">
      <div class="keys">
        <div><b>W A S D</b> 이동</div><div><b>마우스</b> 시점 조작</div>
        <div><b>Shift</b> 달리기</div><div><b>Space</b> 점프</div>
        <div><b>C</b> 웅크리기</div><div><b>T</b> 시간대 바꾸기</div>
        <div><b>H</b> 성능 표시</div><div><b>Esc</b> 설정 / 일시정지</div>
      </div>
      <button id="startBtn" class="primary">클릭하여 탐험 시작</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="card">
    <h1 style="font-size:22px">설정</h1>
    <div class="presets">
      <button class="ghost" data-hour="7.5">이른 아침</button>
      <button class="ghost" data-hour="10.5">오전</button>
      <button class="ghost" data-hour="13.5">한낮</button>
      <button class="ghost" data-hour="16">오후</button>
      <button class="ghost" data-hour="17.6">해질녘</button>
      <button class="ghost" data-hour="18.7">노을</button>
    </div>
    <div class="row"><label for="sQ">그래픽 품질</label>
      <select id="sQ"><option value="0">낮음</option><option value="1">중간</option><option value="2">높음</option><option value="3">최고</option></select><span></span></div>
    <div class="row"><label for="sHour">시간대</label><input id="sHour" type="range" min="6.3" max="18.9" step="0.25"><span class="v" id="sHourV"></span></div>
    <div class="row"><label for="sFov">시야각</label><input id="sFov" type="range" min="55" max="100" step="1"><span class="v" id="sFovV"></span></div>
    <div class="row"><label for="sSens">마우스 감도</label><input id="sSens" type="range" min="0.3" max="2.5" step="0.1"><span class="v" id="sSensV"></span></div>
    <div class="row"><label for="sWind">바람 세기</label><input id="sWind" type="range" min="0" max="2" step="0.1"><span class="v" id="sWindV"></span></div>
    <div class="row"><label for="sVol">볼륨</label><input id="sVol" type="range" min="0" max="1" step="0.05"><span class="v" id="sVolV"></span></div>
    <div class="row chk"><label for="sRefl">수면 실시간 반사</label><input id="sRefl" type="checkbox"></div>
    <div class="row chk"><label for="sBloom">블룸(빛 번짐)</label><input id="sBloom" type="checkbox"></div>
    <div class="row chk"><label for="sGod">빛줄기(God rays)</label><input id="sGod" type="checkbox"></div>
    <div class="row chk"><label for="sAuto">동적 해상도(프레임 자동 조절)</label><input id="sAuto" type="checkbox"></div>
    <div class="row chk"><label for="sFlora">꽃·수변 식물</label><input id="sFlora" type="checkbox"></div>
    <div class="row chk"><label for="sFauna">야생동물·물고기</label><input id="sFauna" type="checkbox"></div>
    <div class="row chk"><label for="sLamps">실내 조명(점광원)</label><input id="sLamps" type="checkbox"></div>
    <div class="row chk"><label for="sVillage">마을·주민</label><input id="sVillage" type="checkbox"></div>
    <div class="row chk"><label for="sMap">미니맵 (M 켜기/끄기 · N 시점 · -/= 확대·축소)</label><input id="sMap" type="checkbox"></div>
    <button id="resumeBtn" class="primary" style="margin-top:14px">계속 탐험하기</button>
  </div>
</div>

<div id="hud"><div id="cross"></div><div id="stats"></div><div id="hint">WASD 이동 · Shift 달리기 · Space 점프 · E 문 열기 · R 낚시 · M 지도 · T 시간대 · Esc 설정</div></div>
<div id="err"></div>

<!--ASSETS_BEGIN--><!--ASSETS_END-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   01_core.js — 수학 유틸, 노이즈, 월드(지형·강·길) 정의, 월드 데이터 텍스처
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- Perlin noise 2D ---------- */
const PERM = new Uint8Array(512);
(function () {
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  const r = mulberry32(1337);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function _g(h, x, y) {
  switch (h & 7) {
    case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
    case 4: return x; case 5: return -x; case 6: return y; default: return -y;
  }
}
function perlin(x, y) {
  const X = Math.floor(x), Y = Math.floor(y);
  x -= X; y -= Y;
  const xi = X & 255, yi = Y & 255;
  const aa = PERM[PERM[xi] + yi], ab = PERM[PERM[xi] + yi + 1];
  const ba = PERM[PERM[xi + 1] + yi], bb = PERM[PERM[xi + 1] + yi + 1];
  const u = x * x * x * (x * (x * 6 - 15) + 10), v = y * y * y * (y * (y * 6 - 15) + 10);
  const l1 = _g(aa, x, y) + (_g(ba, x - 1, y) - _g(aa, x, y)) * u;
  const l2 = _g(ab, x, y - 1) + (_g(bb, x - 1, y - 1) - _g(ab, x, y - 1)) * u;
  return (l1 + (l2 - l1) * v) * 1.2;
}
function fbm(x, y, oct) {
  let a = 0.5, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * perlin(x * f, y * f); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
/* 타일링 가능한 값 노이즈(텍스처 생성용) */
function hash2(ix, iy, seed) {
  let h = (ix * 374761393 + iy * 668265263 + seed * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function tnoise(x, y, per, seed) {
  const X = Math.floor(x), Y = Math.floor(y);
  const fx = x - X, fy = y - Y;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const x0 = ((X % per) + per) % per, x1 = (x0 + 1) % per;
  const y0 = ((Y % per) + per) % per, y1 = (y0 + 1) % per;
  const a = hash2(x0, y0, seed), b = hash2(x1, y0, seed), c = hash2(x0, y1, seed), d = hash2(x1, y1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function tfbm(x, y, per, oct, seed) {
  let s = 0, a = 0.5, n = 0, f = 1;
  for (let i = 0; i < oct; i++) { s += a * tnoise(x * f, y * f, per * f, seed + i * 17); n += a; a *= 0.5; f *= 2; }
  return s / n;
}

/* ---------- 월드 정의 ---------- */
const WORLD = 400, HALF = 200, WATER_Y = 0, TEX_N = 512;
const HOUSE = { x: -38, z: -6, y: 0, rot: Math.PI / 2 };

function riverX(z) { return 38 + 22 * Math.sin(z * 0.012 + 0.5) + 8 * Math.sin(z * 0.031 + 1.7); }
function riverDX(z) { return 22 * 0.012 * Math.cos(z * 0.012 + 0.5) + 8 * 0.031 * Math.cos(z * 0.031 + 1.7); }
function riverHalfW(z) { return 6.5 + 1.8 * Math.sin(z * 0.021 + 0.9) + 1.0 * Math.sin(z * 0.057); }
/* ---------- 작은 호수 ---------- */
const LAKE = { x: -10, z: 80, ax: 17, az: 11, rot: 0.5 };
function lakeT(x, z) {      // 호수 중심 0, 물가 약 1.0 (불규칙한 윤곽)
  const dx = x - LAKE.x, dz = z - LAKE.z, c = Math.cos(LAKE.rot), s = Math.sin(LAKE.rot);
  const u = (c * dx + s * dz) / LAKE.ax, v = (-s * dx + c * dz) / LAKE.az;
  return Math.hypot(u, v) * (1 + 0.2 * (fbm(x * 0.07 + 11, z * 0.07 - 4, 2) - 0.5) + 0.07 * (fbm(x * 0.2, z * 0.2 + 8, 2) - 0.5));
}
function lakePt(u, v) { const c = Math.cos(LAKE.rot), s = Math.sin(LAKE.rot); return [LAKE.x + c * u * LAKE.ax - s * v * LAKE.az, LAKE.z + s * u * LAKE.ax + c * v * LAKE.az]; }

function baseH(x, z) {
  let h = 3.0 + 7.0 * (0.5 + 0.5 * fbm(x * 0.0055 + 3.1, z * 0.0055 - 1.3, 4));
  h += 15 * Math.exp(-((x + 95) * (x + 95) + (z + 70) * (z + 70)) / (2 * 48 * 48));
  h += 10 * Math.exp(-((x - 115) * (x - 115) + (z - 95) * (z - 95)) / (2 * 40 * 40));
  h += 9 * Math.exp(-((x + 65) * (x + 65) + (z - 115) * (z - 115)) / (2 * 36 * 36));
  h += 2.2 * fbm(x * 0.03 + 7, z * 0.03 + 2, 3) + 0.45 * fbm(x * 0.11, z * 0.11 + 5, 3) + 0.08 * fbm(x * 0.5, z * 0.5, 2);
  return h;
}
HOUSE.y = baseH(HOUSE.x, HOUSE.z);
const HOUSE_BOX = { x0: HOUSE.x - 4.6, x1: HOUSE.x + 6.6, z0: HOUSE.z - 5.6, z1: HOUSE.z + 5.6 };
function inHouseBox(x, z, m) { m = m || 0; return x > HOUSE_BOX.x0 - m && x < HOUSE_BOX.x1 + m && z > HOUSE_BOX.z0 - m && z < HOUSE_BOX.z1 + m; }

function terrainH(x, z) {
  let h = baseH(x, z);
  const dh = Math.hypot(x - HOUSE.x, z - HOUSE.z);
  const tt = smoothstep(38, 22, dh);
  if (tt > 0) h = h * (1 - tt) + HOUSE.y * tt;
  h = villageBlendH(h, x, z);
  const rx = riverX(z), w = riverHalfW(z), d = Math.abs(x - rx);
  const infl = smoothstep(55, 7, d);
  if (infl > 0) {
    const fp = 1.2 + 0.35 * fbm(x * 0.05 + 1, z * 0.05 + 3, 2) + 0.15 * fbm(x * 0.4, z * 0.4, 2);
    h = h * (1 - infl) + fp * infl;
  }
  const bw = smoothstep(w * 1.4, w * 0.65, d);
  if (bw > 0) {
    const t = Math.min(d / (w * 1.4), 1);
    const bed = -1.85 * (1 - t * t) - 0.05 + 0.22 * fbm(x * 0.2, z * 0.2, 2);
    h = h * (1 - bw) + bed * bw;
  }
  const lk = lakeT(x, z);
  if (lk < 1.95) {
    const shore = smoothstep(1.95, 1.08, lk), flat = 0.5 + 0.12 * fbm(x * 0.09 + 5, z * 0.09, 2);
    h = h * (1 - shore) + flat * shore;
    const lb = smoothstep(1.06, 0.55, lk);
    if (lb > 0) { const t = Math.min(lk / 1.06, 1), bed = -2.1 * (1 - t * t) - 0.06 + 0.16 * fbm(x * 0.18, z * 0.18 + 2, 2); h = h * (1 - lb) + bed * lb; }
  }
  const r = Math.hypot(x, z);
  const m = smoothstep(450, 1300, r);
  if (m > 0) {
    const ridged = 1 - Math.abs(fbm(x * 0.0012 + 20, z * 0.0012 + 9, 5));
    h += m * (40 + 230 * Math.pow(Math.max(ridged, 0), 2.2));
  }
  return h;
}
function terrainNormal(x, z, out, e) {
  e = e || 0.6;
  const hx = terrainH(x + e, z) - terrainH(x - e, z);
  const hz = terrainH(x, z + e) - terrainH(x, z - e);
  const nx = -hx, ny = 2 * e, nz = -hz;
  const l = Math.hypot(nx, ny, nz);
  out[0] = nx / l; out[1] = ny / l; out[2] = nz / l;
  return out;
}

/* ---------- 산책로(Catmull-Rom) ---------- */
const PATHS = [
  [[-30.5, -6], [-14, -1], [4, 5], [24, 10], [44, 16.5]],
  [[4, 5], [0, -25], [5, -55], [-10, -85], [-25, -115], [-30, -150]],
  [[-14, -1], [-20, 40], [-5, 70], [20, 95], [40, 120], [45, 160]],
  [[-30.5, -6], [-31, -20], [-45, -34], [-62, -44]]
];
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)];
}
function samplePath(pts, step) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const n = Math.max(2, Math.ceil(len / step));
    for (let k = 0; k < n; k++) out.push(catmull(p0, p1, p2, p3, k / n));
  }
  out.push(pts[pts.length - 1]);
  return out;
}

/* ---------- 월드 데이터(높이 + 마스크) ---------- */
const World = {
  N: TEX_N,
  height: new Float32Array(TEX_N * TEX_N * 4),
  mask: new Uint8Array(TEX_N * TEX_N * 4),
  path: new Float32Array(TEX_N * TEX_N),
  forest: new Float32Array(TEX_N * TEX_N),
  heightTex: null, maskTex: null
};
function texIdx(x, z) {
  const N = TEX_N, cell = WORLD / N;
  const i = clamp(Math.floor((x + HALF) / cell), 0, N - 1), j = clamp(Math.floor((z + HALF) / cell), 0, N - 1);
  return j * N + i;
}
function pathAt(x, z) { return World.path[texIdx(x, z)]; }
function forestField(x, z) {
  let f = 0.5 + 0.5 * fbm(x * 0.009 + 10, z * 0.009 - 7, 3);
  f += 0.22 * smoothstep(6, 16, baseH(x, z));            // 언덕은 숲이 더 울창
  let v = smoothstep(0.50, 0.70, f);
  v *= 1 - smoothstep(62, 38, Math.hypot(x - HOUSE.x, z - HOUSE.z));
  return v;
}
function buildWorldData() {
  const N = TEX_N, cell = WORLD / N;
  const path = World.path;
  // 길 스탬프
  for (const pts of PATHS.concat(VILLAGE_PATHS.all)) {
    const s = samplePath(pts, 0.7);
    for (const [px, pz] of s) {
      const r = pts.r || 2.3;
      const i0 = Math.floor((px - r + HALF) / cell), i1 = Math.ceil((px + r + HALF) / cell);
      const j0 = Math.floor((pz - r + HALF) / cell), j1 = Math.ceil((pz + r + HALF) / cell);
      for (let j = Math.max(j0, 0); j <= Math.min(j1, N - 1); j++) for (let i = Math.max(i0, 0); i <= Math.min(i1, N - 1); i++) {
        const x = -HALF + (i + 0.5) * cell, z = -HALF + (j + 0.5) * cell;
        const d = Math.hypot(x - px, z - pz);
        const v = smoothstep(r, 1.0, d);
        if (v > path[j * N + i]) path[j * N + i] = v;
      }
    }

  eye: 1.7, eyeCur: 1.7, onGround: false, keys: {}, fov: 72, fovCur: 72, sens: 1.0,
  bobT: 0, bobAmt: 0, speedXZ: 0, depth: 0, kind: 'grass', _near: [], sprinting: false, camY: 0,
  init(spawn) {
    this.pos.set(spawn.x, this.groundAt(spawn.x, spawn.z, 50).h, spawn.z);
    this.yaw = spawn.yaw; this.pitch = -0.04; this.camY = this.pos.y + this.eye;
  },
  groundAt(x, z, feet) {
    let h = terrainH(x, z), kind = 'terrain';
    const B = Colliders.boxes;
    for (let i = 0; i < B.length; i++) {
      const b = B[i]; if (b.off) continue;
      const dx = x - b.cx, dz = z - b.cz, lx = b.c * dx - b.s * dz, lz = b.s * dx + b.c * dz;
      if (Math.abs(lx) < b.hx && Math.abs(lz) < b.hz && b.top <= feet + 0.5 && b.top > h) { h = b.top; kind = 'wood'; }
    }
    return { h, kind };
  },
  resolve(feet) {
    const p = this.pos, pr = this.radius;
    Colliders.circlesNear(p.x, p.z, this._near);
    for (const o of this._near) {
      const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + pr;
      if (d < m) { const n = d > 1e-5 ? 1 / d : 0; p.x = o.x + (n ? dx * n : 1) * m; p.z = o.z + (n ? dz * n : 0) * m; }
    }
    const B = Colliders.boxes;
    for (let i = 0; i < B.length; i++) {
      const b = B[i]; if (b.off) continue;
      if (feet >= b.top - 0.45 || feet + this.eye < b.bottom) continue;
      const dx = p.x - b.cx, dz = p.z - b.cz;
      if (Math.abs(dx) > b.hx + b.hz + 2) continue;
      let lx = b.c * dx - b.s * dz, lz = b.s * dx + b.c * dz;
      const ex = b.hx + pr, ez = b.hz + pr;
      if (Math.abs(lx) < ex && Math.abs(lz) < ez) {
        const px = ex - Math.abs(lx), pz = ez - Math.abs(lz);
        if (px < pz) lx = (lx >= 0 ? 1 : -1) * ex; else lz = (lz >= 0 ? 1 : -1) * ez;
        p.x = b.cx + b.c * lx + b.s * lz; p.z = b.cz - b.s * lx + b.c * lz;
      }
    }
  },
  moveAxis(dx, dz) {
    const p = this.pos, ox = p.x, oz = p.z;
    p.x += dx; p.z += dz;
    this.resolve(p.y);
    const g = this.groundAt(p.x, p.z, p.y);
    const dep = WATER_Y - terrainH(p.x, p.z);
    if (g.h - p.y > 0.55 || (dep > 1.3 && g.kind === 'terrain') || Math.abs(p.x) > 560 || Math.abs(p.z) > 560) { p.x = ox; p.z = oz; }
  },
  update(dt) {
    const k = this.keys, p = this.pos;
    const f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0), r = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    const crouch = !!(k.KeyC || k.ControlLeft), sprint = !!(k.ShiftLeft || k.ShiftRight) && f > 0 && !crouch;
    this.sprinting = sprint && (f !== 0 || r !== 0);
    let speed = crouch ? 1.9 : (sprint ? 6.8 : 3.7);
    const g0 = this.groundAt(p.x, p.z, p.y);
    const dep = g0.kind === 'terrain' ? Math.max(0, WATER_Y - g0.h) : 0;
    this.depth = dep;
    speed *= 1 - 0.5 * clamp(dep / 1.2, 0, 1);
    const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
    let tx = (-sy * f + cy * r), tz = (-cy * f - sy * r);
    const tl = Math.hypot(tx, tz); if (tl > 0) { tx = tx / tl * speed; tz = tz / tl * speed; }
    const acc = this.onGround ? 11 : 2.2, a = Math.min(1, acc * dt);
    this.vel.x += (tx - this.vel.x) * a; this.vel.z += (tz - this.vel.z) * a;
    if (k.Space && this.onGround && !crouch) { this.vel.y = 6.1; this.onGround = false; Sound.jump(); }
    if (!this.onGround) this.vel.y -= 22 * dt;
    const hs = Math.hypot(this.vel.x, this.vel.z);
    const n = Math.max(1, Math.ceil(hs * dt / 0.18));
    for (let i = 0; i < n; i++) { this.moveAxis(this.vel.x * dt / n, 0); this.moveAxis(0, this.vel.z * dt / n); }
    p.y += this.vel.y * dt;
    const g = this.groundAt(p.x, p.z, p.y + 0.0);
    const was = this.onGround;
    if (this.vel.y <= 0 && p.y <= g.h + (was ? 0.5 : 0.0)) {
      if (!was && this.vel.y < -5) Sound.land(g.kind === 'wood' ? 'wood' : 'grass', -this.vel.y);
      p.y = g.h; this.vel.y = 0; this.onGround = true;
    } else this.onGround = false;
    this.kind = g.kind === 'wood' ? 'wood' : (dep > 0.05 ? 'water' : (pathAt(p.x, p.z) > 0.45 && Math.abs(p.x) < HALF ? 'dirt' : 'grass'));
    this.speedXZ = Math.hypot(this.vel.x, this.vel.z);
    // 카메라 높이/보빙
    const eyeT = crouch ? 1.15 : 1.7; this.eyeCur += (eyeT - this.eyeCur) * Math.min(1, dt * 9);
    const moving = this.onGround && this.speedXZ > 0.4;
    const prevPh = Math.floor(this.bobT / Math.PI);
    if (moving) this.bobT += this.speedXZ * dt * 1.85;
    if (moving && Math.floor(this.bobT / Math.PI) !== prevPh) Sound.step(this.kind, this.speedXZ, dep);
    this.bobAmt += ((moving ? (this.sprinting ? 0.055 : 0.032) : 0) - this.bobAmt) * Math.min(1, dt * 8);
    const targetCam = p.y + this.eyeCur;
    this.camY += (targetCam - this.camY) * Math.min(1, dt * (Math.abs(targetCam - this.camY) > 0.6 ? 30 : 16));
    return {
      x: p.x, y: this.camY + Math.abs(Math.sin(this.bobT)) * this.bobAmt - this.bobAmt * 0.5, z: p.z,
      sway: Math.cos(this.bobT) * this.bobAmt * 0.35
    };
  },
  applyCamera(camera, dt, cp) {
    camera.position.set(cp.x, cp.y, cp.z);
    camera.rotation.order = 'YXZ'; camera.rotation.y = this.yaw; camera.rotation.x = this.pitch; camera.rotation.z = cp.sway * 0.03;
    const ft = this.fov + (this.sprinting ? 7 : 0);
    this.fovCur += (ft - this.fovCur) * Math.min(1, dt * 6);
    if (Math.abs(camera.fov - this.fovCur) > 0.01) { camera.fov = this.fovCur; camera.updateProjectionMatrix(); }
  }
};

const Sound = {
  ctx: null, master: null, vol: 0.7, enabled: true, nextBird: 3,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC(); this.master = c.createGain(); this.master.gain.value = this.vol; this.master.connect(c.destination);
      const len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      let b0 = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; b0 = 0.97 * b0 + 0.03 * w; d[i] = w * 0.6 + b0 * 4; }
      this.noiseBuf = buf;
      const mk = (type, freq, q) => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7; const g = c.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); s.start(0, Math.random() * 2); return { s, f, g }; };
      this.wind = mk('bandpass', 380, 0.5); this.wind.g.connect(this.master);
      this.leaves = mk('highpass', 3200, 0.6); this.leaves.g.connect(this.master);
      this.riverA = mk('lowpass', 1100, 0.4); this.riverB = mk('bandpass', 2600, 0.9);
      this.pan = c.createStereoPanner ? c.createStereoPanner() : null;
      const rg = c.createGain(); rg.gain.value = 1; this.riverA.g.connect(rg); this.riverB.g.connect(rg);
      if (this.pan) { rg.connect(this.pan); this.pan.connect(this.master); } else rg.connect(this.master);
    } catch (e) { console.warn('audio init failed', e); this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.value = v; },
  update(dt, cam, gust) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, p = Player.pos;
    const w = SH.uWindAmp.value;
    this.wind.g.gain.setTargetAtTime((0.05 + 0.10 * gust) * (0.4 + w), t, 0.3);
    this.wind.f.frequency.setTargetAtTime(260 + 380 * gust, t, 0.3);
    this.leaves.g.gain.setTargetAtTime(0.012 + 0.03 * gust * gust * w, t, 0.3);
    const rx = riverX(p.z), hw = riverHalfW(p.z), dist = Math.max(0, Math.abs(p.x - rx) - hw);
    const rg = 0.30 / Math.pow(1 + dist * 0.045, 2);
    this.riverA.g.gain.setTargetAtTime(rg * 0.7, t, 0.2); this.riverB.g.gain.setTargetAtTime(rg * 0.22, t, 0.2);
    if (this.pan) {
      const sx = rx - p.x, fwdX = -Math.sin(Player.yaw), fwdZ = -Math.cos(Player.yaw), rightX = Math.cos(Player.yaw), rightZ = -Math.sin(Player.yaw);
      this.pan.pan.setTargetAtTime(clamp(sx * rightX / (Math.abs(sx) + 18), -0.8, 0.8), t, 0.2);
    }
    this.nextBird -= dt;
    if (this.nextBird <= 0) { this.nextBird = 1.5 + Math.random() * 5; if (Atmo.sunY > 0.12) this.bird(); }
  },
  env(g, t, a, d, peak) { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  bird() {
    const c = this.ctx, t0 = c.currentTime, n = 2 + Math.floor(Math.random() * 4), base = 2200 + Math.random() * 2600, sweep = (Math.random() - 0.3) * 1600;
    const pan = c.createStereoPanner ? c.createStereoPanner() : null; if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; pan.connect(this.master); }
    const out = pan || this.master;
    for (let i = 0; i < n; i++) {
      const t = t0 + i * (0.11 + Math.random() * 0.05), o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(Math.max(800, base + sweep), t + 0.09);
      lfo.frequency.value = 38; lg.gain.value = 110; lfo.connect(lg); lg.connect(o.frequency);
      o.connect(g); g.connect(out); this.env(g, t, 0.012, 0.08, 0.035 + Math.random() * 0.02);
      o.start(t); o.stop(t + 0.14); lfo.start(t); lfo.stop(t + 0.14);

  },
  burst(type, f, q, peak, dur, pan) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = c.createGain();
    s.connect(fl); fl.connect(g); g.connect(this.master); this.env(g, t, 0.008, dur, peak); s.start(t, Math.random() * 2); s.stop(t + dur + 0.05);
  },
  step(kind, speed, depth) {
    const k = clamp(speed / 6.5, 0.4, 1.2);
    if (kind === 'wood') this.burst('bandpass', 420 + Math.random() * 120, 1.2, 0.22 * k, 0.11);
    else if (kind === 'water') { this.burst('highpass', 1400, 0.6, 0.20 * k, 0.28); this.burst('bandpass', 700, 0.8, 0.12 * k, 0.3); }
    else if (kind === 'dirt') this.burst('lowpass', 900 + Math.random() * 300, 0.7, 0.2 * k, 0.09);

  },
  jump() { this.burst('lowpass', 700, 0.5, 0.08, 0.1); },
  land(kind, v) { const k = clamp(v / 10, 0.3, 1); this.burst(kind === 'wood' ? 'bandpass' : 'lowpass', kind === 'wood' ? 350 : 500, 0.8, 0.3 * k, 0.16); }
};

const Motes = {
  mesh: null,
  init(scene) {
    const N = 700, pos = new Float32Array(N * 3), rnd = new Float32Array(N * 2), R = mulberry32(99);
    for (let i = 0; i < N; i++) { pos[i * 3] = R() * 40; pos[i * 3 + 1] = R() * 40; pos[i * 3 + 2] = R() * 40; rnd[i * 2] = R(); rnd[i * 2 + 1] = R(); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aR', new THREE.BufferAttribute(rnd, 2));
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: SH.uTime, uSunDirW: SH.uSunDirW, uSunCol: SH.uSunCol, uPix: { value: 1 }, uAmt: { value: 1 } },
      vertexShader: `
        uniform float uTime; uniform float uPix; uniform vec3 uSunDirW;
        attribute vec2 aR; varying float vA;
        void main(){
          vec3 b = position + vec3(sin(uTime * 0.2 + aR.x * 40.0) * 2.0, uTime * (0.08 + aR.y * 0.15), cos(uTime * 0.17 + aR.y * 30.0) * 2.0) + vec3(uTime * 0.25, 0.0, uTime * 0.1);
          vec3 w = cameraPosition + mod(b - cameraPosition + 20.0, 40.0) - 20.0;
          vec4 mv = viewMatrix * vec4(w, 1.0);

          float d = -mv.z;
          gl_PointSize = clamp((1.0 + aR.x * 2.0) * uPix * 28.0 / max(d, 0.5), 1.0, 7.0 * uPix);
          vec3 vd = normalize(w - cameraPosition);

          vA = (0.12 + 0.75 * back) * smoothstep(1.0, 4.0, d) * smoothstep(20.0, 12.0, d) * (0.5 + 0.5 * sin(uTime * 1.3 + aR.y * 50.0));

const Butterflies = {
  mesh: null, N: 26, st: [],
  init(scene) {
    const N = this.N, R = mulberry32(4242), col = new Float32Array(N * 3), ph = new Float32Array(N);
    const pal = [[1.0, 0.55, 0.12], [0.95, 0.92, 0.85], [1.0, 0.85, 0.2], [0.35, 0.55, 1.0], [0.9, 0.3, 0.35]];

      this.st.push({ x: (R() - 0.5) * 32, z: (R() - 0.5) * 32, a: R() * 6.28, sp: 0.8 + R() * 1.2, t: R() * 100, y: 0.9 + R() * 1.4 });
    }

    g.setAttribute('aCol', new THREE.BufferAttribute(col, 3)); g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: SH.uTime, uSunCol: SH.uSunCol, uAmb: SH.uAmb, uPix: { value: 1 }, uAmt: { value: 1 } },
      vertexShader: `
        uniform float uTime; uniform float uPix; attribute vec3 aCol; attribute float aPh; varying vec3 vC; varying float vF;
        void main(){
          vec4 mv = viewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv;
          float fl = abs(sin(uTime * 13.0 + aPh)); vF = fl;

        }`,
      fragmentShader: `
        uniform vec3 uSunCol; uniform vec3 uAmb; uniform float uAmt; varying vec3 vC; varying float vF;
        void main(){
          vec2 p = (gl_PointCoord - 0.5) * 2.0; p.x /= max(0.25 + 0.75 * vF, 0.15);
          float w = 1.0 - smoothstep(0.55, 0.75, length(vec2(abs(p.x) - 0.4, p.y * 0.8)));

  let S = Object.assign({}, DEFAULTS), hadSaved = false;
  try { const raw = localStorage.getItem('riverside_forest_settings'); if (raw) { S = Object.assign(S, JSON.parse(raw)); hadSaved = true; } S.hour = Math.min(18.9, Math.max(6.3, +S.hour || 16)); } catch (e) { }
  const save = () => { try { localStorage.setItem('riverside_forest_settings', JSON.stringify(S)); } catch (e) { } };

  main().catch((e) => { console.error(e); showError('초기화 실패: ' + (e && e.message ? e.message : e)); });

  async function main() {
    const canvas = $('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
    if (!renderer.capabilities.isWebGL2) throw new Error('이 브라우저는 WebGL2를 지원하지 않습니다. 최신 Chrome / Edge / Firefox / Safari 를 사용해 주세요.');
    renderer.outputEncoding = THREE.LinearEncoding; renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 1); renderer.info.autoReset = false;
    MAX_ANISO.v = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    if (!hadSaved) {
      try { const ext = renderer.getContext().getExtension('WEBGL_debug_renderer_info'); const gpu = ext ? String(renderer.getContext().getParameter(ext.UNMASKED_RENDERER_WEBGL)) : ''; if (/Intel|Mali|Adreno|PowerVR|SwiftShader|llvmpipe/i.test(gpu)) S.q = 1; } catch (e) { }
    }

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xb8d0e8, 0.0018);
    const camera = new THREE.PerspectiveCamera(S.fov, innerWidth / innerHeight, 0.12, 6000);
    camera.layers.enable(1);
    const hemi = new THREE.HemisphereLight(0xaaccff, 0x554422, 0.25); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff0d8, 3.4); sun.castShadow = true;
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.22; sun.shadow.camera.near = 10; sun.shadow.camera.far = 340;
    scene.add(sun); scene.add(sun.target);
    Atmo.lights = { sun, hemi, scene }; updateAtmosphere(S.hour);
    SH.uWindAmp.value = S.wind;

    const step = async (label, p) => { $('loadText').textContent = label; $('loadBar').style.width = p + '%'; await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0))); };
    const spawnW = House.toWorld(0, 3.5 + 6.5);
    const spawn = { x: spawnW[0], z: spawnW[1], yaw: -Math.PI / 2 };

    await step('에셋을 푸는 중…', 2); await AssetLib.unpack();
    await step('지형과 강을 빚는 중…', 4);
    buildWorldData(); SH.uHeightTex.value = World.heightTex; SH.uMaskTex.value = World.maskTex;
    Terrain.init(scene); Terrain.warm(new THREE.Vector3(spawn.x, 0, spawn.z), 105);
    await step('하늘과 물결을 만드는 중…', 18);
    const sky = new THREE.Mesh(new THREE.SphereGeometry(3500, 32, 16), makeSkyMaterial(false));
    sky.frustumCulled = false; sky.renderOrder = -10; scene.add(sky);
    Water.init(scene);
    let pmrem = null, envRT = null, envScene = null, envMat = null, envCube = null, envCam = null;
    function updateEnv() {
      try {
        if (!pmrem) { pmrem = new THREE.PMREMGenerator(renderer); envScene = new THREE.Scene(); envMat = makeSkyMaterial(true); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 12), envMat)); envCube = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType, format: THREE.RGBAFormat }); envCam = new THREE.CubeCamera(0.1, 100, envCube); }
        const u = envMat.uniforms; u.uSunDirW.value.copy(SH.uSunDirW.value); u.uSunCol.value.copy(SH.uSunCol.value); u.uAmb.value.copy(SH.uAmb.value); u.uSunAz.value.copy(SH.uSunAz.value);
        /* ShaderMaterial 을 PMREM.fromScene 으로 직접 굽으면 일부 드라이버(SwiftShader 등)에서 NaN 이 나오므로 큐브맵 경유 */
        envCam.update(renderer, envScene);
        const rt = pmrem.fromCubemap(envCube.texture);
        if (envRT) envRT.dispose(); envRT = rt; scene.environment = rt.texture;
      } catch (e) { console.warn('환경맵 생성 실패', e); }
    }
    updateEnv();
    await step('나무를 심는 중…', 32);
    initTreeMaterials();
    const veg = placeVegetation();
    const counts = new Array(TreeSys.defs.length).fill(0);
    for (const t of veg.trees) counts[t.v]++; for (const t of veg.bushes) counts[t.v]++;
    TreeSys.buildVariants(scene, counts);
    for (const t of veg.trees.concat(veg.bushes)) {
      TreeSys.addTree(t.v, t.x, t.y, t.z, t.rot, t.s);
      const d = TreeSys.defs[t.v];
      if (d.species !== 'bush') {
        const r0 = d.kind === 'spruce' ? SPRUCE[d.P].r0 : BROADLEAF[d.P].r0;
        if (Math.abs(t.x) < 330 && Math.abs(t.z) < 330) Colliders.addCircle(t.x, t.z, r0 * t.s * 1.05 + 0.06);
      }
    }
    await step('바위와 풀, 야생화를 흩뿌리는 중…', 58);
    Rocks.init(scene, veg.rocks);
    Grass.init(scene); Flowers.init(scene);
    await step('집과 부두를 짓는 중…', 76);
    House.init(scene); Smoke.init(scene); Motes.init(scene); Butterflies.init(scene);
    Player.init(spawn);
    await step('숲의 동물과 꽃을 불러오는 중…', 88); Flora.init(scene); Fauna.init(scene, spawn); Village.init(scene); Fishing.init(scene, camera); Minimap.init();
    Player.fov = S.fov; Player.sens = S.sens;
    await step('빛과 그림자를 준비하는 중…', 92);

    const post = new Post(renderer);
    let dyn = 1.0;
    function applyQuality() {
      const Q = QUALITY[S.q];
      const w = innerWidth, h = innerHeight, pr = Math.min(window.devicePixelRatio || 1, Q.pr);
      renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
      const bw = Math.floor(w * pr), bh = Math.floor(h * pr);
      post.bloomOn = Q.bloom && S.bloom; post.god = (S.god ? Q.god : 0);
      post.resize(bw * dyn, bh * dyn, Q.samples);
      Reflection.scale = Q.refl; Reflection.enabled = S.refl; Reflection.resize(bw, bh);
      sun.shadow.mapSize.set(Q.shadow, Q.shadow);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
      const R = Q.shadowR, c = sun.shadow.camera; c.left = -R; c.right = R; c.top = R; c.bottom = -R; c.updateProjectionMatrix();
      sun._R = R; sun._map = Q.shadow;
      TreeSys.distScale = Q.dist; Grass.setQuality(S.q); Flowers.setQuality(S.q); Flora.setQuality(S.q);
      Motes.mesh.material.uniforms.uPix.value = pr;
      sun.shadow.needsUpdate = true;
    }
    applyQuality();
    window.addEventListener('resize', applyQuality);
    await step('완료!', 100);

    /* ---------- 그림자 카메라 (텍셀 스냅) ---------- */
    const _c = new THREE.Vector3(), _x = new THREE.Vector3(), _y = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0), _f = new THREE.Vector3();
    function updateShadow() {
      const L = Atmo.lightDir, R = sun._R, texel = (2 * R) / sun._map;
      camera.getWorldDirection(_f); _f.y = 0; if (_f.lengthSq() > 1e-6) _f.normalize();
      _c.copy(camera.position).addScaledVector(_f, R * 0.25);
      _x.copy(_up).cross(L); if (_x.lengthSq() < 1e-6) _x.set(1, 0, 0); _x.normalize(); _y.copy(L).cross(_x).normalize();
      const cx = _c.dot(_x), cy = _c.dot(_y);
      _c.addScaledVector(_x, Math.floor(cx / texel) * texel - cx).addScaledVector(_y, Math.floor(cy / texel) * texel - cy);
      sun.position.copy(_c).addScaledVector(L, 170); sun.target.position.copy(_c);
      sun.target.updateMatrixWorld(); sun.updateMatrixWorld();
    }

    /* ---------- UI ---------- */
    let started = false, locked = false, dragMode = false, showStats = true, pending = false, lockWorked = false;
    const overlay = $('overlay'), menu = $('menu'), hud = $('hud');
    const fmtHour = (h) => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
    function bind(id, key, fmt, cb) {
      const el = $(id), out = $(id + 'V');
      if (el.type === 'checkbox') { el.checked = !!S[key]; el.addEventListener('change', () => { S[key] = el.checked; save(); cb && cb(); }); return; }
      el.value = S[key]; if (out) out.textContent = fmt ? fmt(S[key]) : S[key];
      const on = () => { S[key] = el.tagName === 'SELECT' ? parseInt(el.value, 10) : parseFloat(el.value); if (out) out.textContent = fmt ? fmt(S[key]) : S[key]; save(); cb && cb(); };
      el.addEventListener('input', on); el.addEventListener('change', on);
    }
    let envTimer = 0;
    bind('sQ', 'q', null, applyQuality);
    bind('sFov', 'fov', (v) => v + '°', () => { Player.fov = S.fov; });
    bind('sSens', 'sens', (v) => v.toFixed(1), () => { Player.sens = S.sens; });
    bind('sHour', 'hour', fmtHour, () => { updateAtmosphere(S.hour); clearTimeout(envTimer); envTimer = setTimeout(updateEnv, 250); });
    bind('sWind', 'wind', (v) => v.toFixed(1), () => { SH.uWindAmp.value = S.wind; });
    bind('sVol', 'vol', (v) => Math.round(v * 100) + '%', () => Sound.setVol(S.vol));
    bind('sRefl', 'refl', null, () => { Reflection.enabled = S.refl; });
    bind('sBloom', 'bloom', null, applyQuality);
    bind('sGod', 'god', null, applyQuality);
    bind('sFlora', 'flora', null, () => Flora.setEnabled(S.flora));
    bind('sFauna', 'fauna', null, () => Fauna.setEnabled(S.fauna));
    bind('sVillage', 'village', null, () => Village.setEnabled(S.village));
    Village.setEnabled(S.village);
    bind('sMap', 'map', null, () => Minimap.setEnabled(S.map));
    Minimap.setEnabled(S.map);
    bind('sLamps', 'lamps', null, () => House.setLamps && House.setLamps(S.lamps));
    Flora.setEnabled(S.flora); Fauna.setEnabled(S.fauna); House.setLamps && House.setLamps(S.lamps);
    bind('sAuto', 'auto', null, () => { if (!S.auto && dyn !== 1) { dyn = 1; applyQuality(); } });
    Sound.vol = S.vol;
    document.querySelectorAll('[data-hour]').forEach((b) => b.addEventListener('click', () => {
      S.hour = parseFloat(b.dataset.hour); save(); $('sHour').value = S.hour; $('sHourV').textContent = fmtHour(S.hour); updateAtmosphere(S.hour); clearTimeout(envTimer); envTimer = setTimeout(updateEnv, 100);
    }));

    function setLocked(v) {
      locked = v;
      overlay.style.display = started ? 'none' : 'flex';
      menu.style.display = (started && !locked && !pending) ? 'flex' : 'none';
      hud.style.display = locked ? 'block' : 'none';
      if (!locked) { for (const k in Player.keys) Player.keys[k] = false; }
    }
    function requestLock() {
      pending = true; setTimeout(() => { pending = false; setLocked(locked); }, 700);
      try {
        const p = canvas.requestPointerLock && canvas.requestPointerLock();
        if (p && p.catch) p.catch(() => { if (!lockWorked) { dragMode = true; setLocked(true); } });
      } catch (e) { if (!lockWorked) { dragMode = true; setLocked(true); } }
      setTimeout(() => { if (!document.pointerLockElement && !locked && !lockWorked) { dragMode = true; setLocked(true); } }, 450);
    }
    const startGame = () => { started = true; Sound.init(); Sound.resume(); requestLock(); setLocked(dragMode ? true : locked); };
    $('startBtn').addEventListener('click', startGame);
    $('resumeBtn').addEventListener('click', () => { Sound.resume(); if (dragMode) setLocked(true); else requestLock(); });
    document.addEventListener('pointerlockchange', () => { const l = document.pointerLockElement === canvas; if (l) { dragMode = false; lockWorked = true; } setLocked(l || (dragMode && locked)); });
    document.addEventListener('pointerlockerror', () => { if (!lockWorked) { dragMode = true; setLocked(true); } });
    document.addEventListener('mousemove', (e) => {
      if (!locked) return;
      if (dragMode && e.buttons === 0) return;
      const s = 0.0022 * Player.sens;
      Player.yaw -= e.movementX * s; Player.pitch = clamp(Player.pitch - e.movementY * s, -1.5, 1.5);
    });
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.code === 'Escape' && dragMode && locked) { setLocked(false); return; }
      if (!locked) return;
      Player.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlLeft'].includes(e.code)) e.preventDefault();
      if (e.code === 'KeyH') { showStats = !showStats; $('stats').style.display = showStats ? 'block' : 'none'; }
      if (e.code === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
      if (e.code === 'KeyT') { const hs = [7.5, 10.5, 13.5, 16, 17.6, 18.7]; let i = hs.findIndex((h) => h > S.hour + 0.05); if (i < 0) i = 0; S.hour = hs[i]; $('sHour').value = S.hour; $('sHourV').textContent = fmtHour(S.hour); updateAtmosphere(S.hour); clearTimeout(envTimer); envTimer = setTimeout(updateEnv, 120); save(); }
    });
    window.addEventListener('keyup', (e) => { Player.keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in Player.keys) Player.keys[k] = false; });
    $('loading').style.display = 'none'; $('startBox').style.display = 'block';

    /* ---------- 메인 루프 ---------- */
    let last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShown = 60, dynTimer = 0, warm = 0;
    let camState = { x: Player.pos.x, y: Player.pos.y + 1.7, z: Player.pos.z, sway: 0 };
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000)); last = now;
      SH.uTime.value += dt; renderer.info.reset();
      if (locked) camState = Player.update(dt); else camState.y += (Player.pos.y + Player.eyeCur - camState.y) * 0;
      Player.applyCamera(camera, dt, camState);
      camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
      sky.position.copy(camera.position);
      Grass.update(camera.position); Fauna.update(dt, camera); Flora.update(dt, camera); House.update(dt, camera); Village.update(dt, camera); Fishing.update(dt, camera); Minimap.update(dt, camera);
      TreeSys.update(camera);
      Terrain.update(camera.position, warm < 4 ? 8 : 3); warm++;
      updateShadow();
      Reflection.render(renderer, scene, camera, sky);
      Atmo.exposure += (Atmo.exposureTarget - Atmo.exposure) * Math.min(1, dt * 2.5);
      post.render(() => renderer.render(scene, camera), camera, SH.uSunCol.value, Atmo.exposure * 0.74);
      const pr = renderer.getPixelRatio();
      const pf = innerHeight * pr * dyn / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
      Smoke.update(pf);
      Motes.update(pr); Butterflies.update(dt, camera.position, pf);
      const t = SH.uTime.value; Sound.update(dt, camera, clamp(0.55 + 0.3 * Math.sin(t * 0.65) + 0.22 * Math.sin(t * 1.7), 0, 1.2));
      // FPS / 동적 해상도
      fpsAcc += dt; fpsN++; dynTimer += dt;
      if (fpsAcc >= 0.5) { fpsShown = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; if (showStats) $('stats').textContent = Math.round(fpsShown) + ' FPS · ' + renderer.info.render.triangles.toLocaleString() + ' tris · 나무 ' + TreeSys.stats() + ' · 해상도 ' + Math.round(dyn * 100) + '%'; }
      if (dynTimer >= 1.2) {
        dynTimer = 0;
        if (S.auto && started) {
          let nd = dyn;
          if (fpsShown < 45) nd = Math.max(0.55, dyn - 0.08); else if (fpsShown > 58 && dyn < 1) nd = Math.min(1, dyn + 0.04);
          if (Math.abs(nd - dyn) > 0.001) { dyn = nd; const pr2 = renderer.getPixelRatio(); post.resize(innerWidth * pr2 * dyn, innerHeight * pr2 * dyn); }
        }
      }
    }
    requestAnimationFrame(frame);
    window.__forest = { scene, camera, renderer, Player, S, Fauna, Flora, House, Fishing, Minimap, Village };
  }
})();
